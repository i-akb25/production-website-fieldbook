{
  "schema_version": "1.0.0",
  "repository_version": "1.0.0",
  "book_edition": "1.0",
  "controls": [
    {
      "id": "CORE-00",
      "title": "No unexplained design",
      "requirement_level": "MUST",
      "scope": ["book", "design", "content"],
      "requirement": "Every visible choice must trace to a user need, brand position, content hierarchy, accessibility requirement, or system behavior.",
      "rationale": "Novelty and generated polish do not establish product purpose, usability, or a coherent visual system.",
      "implementation_evidence": ["Design thesis", "Decision record", "Approved content hierarchy"],
      "tests": ["Design review against the substitution test", "Representative user-journey review"],
      "owner": "product-and-design-owner",
      "exception": { "allowed": false, "conditions": "No exception for unexplained production design.", "expiry_required": false, "approval_required": "product-owner" },
      "source_reference": "Chapter 2"
    },
    {
      "id": "CMP-01",
      "title": "Explicit component contracts",
      "requirement_level": "MUST",
      "scope": ["component", "design", "client"],
      "requirement": "Reusable components must define purpose, anatomy, finite variants, valid states, accessibility, responsive behavior, content constraints, tests, owner, and misuse guidance.",
      "rationale": "Unbounded boolean configuration hides contradictory states and produces inconsistent interfaces.",
      "implementation_evidence": ["Completed component contract", "Typed API or schema", "State examples"],
      "tests": ["Component behavior tests", "Keyboard and focus checks", "Responsive visual checks"],
      "owner": "component-owner",
      "exception": { "allowed": true, "conditions": "A one-use local element may use a reduced contract if its states and accessibility are still documented.", "expiry_required": true, "approval_required": "design-system-owner" },
      "source_reference": "Chapter 7"
    },
    {
      "id": "PLH-01",
      "title": "No fake reality",
      "requirement_level": "MUST",
      "scope": ["content", "component", "page", "release"],
      "requirement": "Every placeholder must be discoverable, classified, assigned to an owner and ticket, and release-blocked when it represents missing truth or integration.",
      "rationale": "Plausible placeholder content is easily mistaken for approved claims, real users, completed payments, or working integrations.",
      "implementation_evidence": ["Placeholder register", "Release-blocking query", "Content approval record"],
      "tests": ["Repository placeholder scan", "Pre-release content review"],
      "owner": "content-owner",
      "exception": { "allowed": true, "conditions": "Non-deceptive skeleton UI and local development fixtures may remain outside production output.", "expiry_required": true, "approval_required": "release-owner" },
      "source_reference": "Chapter 9"
    },
    {
      "id": "PAGE-01",
      "title": "Complete page specification",
      "requirement_level": "MUST",
      "scope": ["page", "client", "server", "testing"],
      "requirement": "Every production route must define purpose, audience, success, ownership, content source, data authority, complete states, accessibility, responsive rules, performance budgets, security, analytics, and acceptance evidence.",
      "rationale": "A route is an operational contract, not a screenshot or a collection of components.",
      "implementation_evidence": ["Page specification", "Route inventory", "Acceptance record"],
      "tests": ["State matrix", "Responsive and assistive-technology journeys", "Authorization and failure-path tests"],
      "owner": "route-owner",
      "exception": { "allowed": false, "conditions": "Every released route requires an accountable specification.", "expiry_required": false, "approval_required": "release-owner" },
      "source_reference": "Chapter 12"
    },
    {
      "id": "FS-13",
      "title": "Design failure before success",
      "requirement_level": "MUST",
      "scope": ["client", "server", "api", "testing"],
      "requirement": "Network actions must define timeout, duplicate submission, stale version, partial completion, provider outage, reconnect, recovery, and rollback before release.",
      "rationale": "Production correctness depends on failure behavior and recovery, not only the happy-path result.",
      "implementation_evidence": ["Failure-state specification", "Idempotency design", "Rollback procedure"],
      "tests": ["Timeout and retry test", "Duplicate request test", "Partial failure and recovery test"],
      "owner": "engineering-owner",
      "exception": { "allowed": false, "conditions": "Applicable failure paths cannot be deferred past release.", "expiry_required": false, "approval_required": "engineering-owner" },
      "source_reference": "Chapter 13"
    },
    {
      "id": "SEC-14",
      "title": "Server authority and object authorization",
      "requirement_level": "MUST",
      "scope": ["server", "api", "security", "data"],
      "requirement": "The server must validate input, authenticate identity, authorize every object and action, enforce tenant boundaries, encode output for its context, and return safe errors.",
      "rationale": "Client state and identifiers are attacker-controlled and cannot establish authorization or business truth.",
      "implementation_evidence": ["Authorization matrix", "API validation schemas", "Tenant-boundary design"],
      "tests": ["Negative object-authorization tests", "Cross-tenant tests", "Malformed-input and output-encoding tests"],
      "owner": "security-owner",
      "exception": { "allowed": false, "conditions": "No exception for missing authorization on protected data or actions.", "expiry_required": false, "approval_required": "security-owner" },
      "source_reference": "Chapter 14"
    },
    {
      "id": "RT-14",
      "title": "Persistent does not mean trusted",
      "requirement_level": "MUST",
      "scope": ["realtime", "server", "api", "security", "operations"],
      "requirement": "Persistent connections must use secure transport, authenticated handshakes, per-action authorization, validated messages, bounded rates and queues, safe lifetime rules, observable reconnect behavior, and privacy-safe logs.",
      "rationale": "One accepted connection can carry many later actions and consume resources long after the initial handshake.",
      "implementation_evidence": ["Connection threat model", "Message schemas", "Rate and queue limits", "Reconnect protocol"],
      "tests": ["Unauthorized subscription test", "Malformed and oversized message test", "Connection flood and backpressure test", "Drop and reconciliation test"],
      "owner": "realtime-service-owner",
      "exception": { "allowed": false, "conditions": "Persistent production channels require bounded authorization and resource controls.", "expiry_required": false, "approval_required": "security-owner" },
      "source_reference": "Section 14.4"
    },
    {
      "id": "PAY-01",
      "title": "Server-authoritative payment state",
      "requirement_level": "MUST",
      "scope": ["payment", "server", "api", "data"],
      "requirement": "Amounts, entitlements, payment state, webhook effects, refunds, and reconciliation must be server-authoritative, authenticated, idempotent, auditable, and recoverable.",
      "rationale": "Client confirmation and redirects do not prove settlement, ownership, currency, or entitlement.",
      "implementation_evidence": ["Payment state machine", "Provider verification design", "Reconciliation and refund records"],
      "tests": ["Forged client-success test", "Duplicate and out-of-order webhook tests", "Refund and settlement reconciliation test"],
      "owner": "payment-owner",
      "exception": { "allowed": false, "conditions": "Financial correctness cannot rely on client state.", "expiry_required": false, "approval_required": "payment-owner" },
      "source_reference": "Chapter 15"
    },
    {
      "id": "TEST-01",
      "title": "Risk-based test evidence",
      "requirement_level": "MUST",
      "scope": ["testing", "release", "security"],
      "requirement": "Testing must cover applicable static, unit, component, integration, contract, end-to-end, visual, accessibility, security, performance, and resilience risks, including negative paths.",
      "rationale": "A passing happy path does not demonstrate authorization, recovery, accessibility, or operational stability.",
      "implementation_evidence": ["Risk-to-test matrix", "Exact test results", "Manual QA record"],
      "tests": ["Independent evidence review", "Known-defect and skipped-test review"],
      "owner": "quality-owner",
      "exception": { "allowed": true, "conditions": "A non-applicable test category must record why it is not applicable and who accepted that conclusion.", "expiry_required": true, "approval_required": "release-owner" },
      "source_reference": "Chapter 18"
    },
    {
      "id": "REL-21",
      "title": "Progressive and reversible release",
      "requirement_level": "MUST",
      "scope": ["release", "operations", "server", "data"],
      "requirement": "Releases must use immutable artifacts, controlled environment promotion, observable rollout, tested migration sequencing, defined stop thresholds, and a viable rollback or forward-fix path.",
      "rationale": "Deployment without evidence and recovery converts ordinary defects into prolonged incidents.",
      "implementation_evidence": ["Artifact identity", "Release plan", "Migration and rollback record", "Monitoring thresholds"],
      "tests": ["Rollback rehearsal", "Migration compatibility test", "Canary or staged-release review"],
      "owner": "release-owner",
      "exception": { "allowed": true, "conditions": "A constrained emergency path requires recorded authority, compensating monitoring, and retrospective review.", "expiry_required": true, "approval_required": "incident-commander" },
      "source_reference": "Chapter 21"
    },
    {
      "id": "CTR-21",
      "title": "Hardened reproducible containers",
      "requirement_level": "SHOULD",
      "scope": ["release", "operations", "security"],
      "requirement": "When containers are used, images should be minimal, pinned, scanned, provenance-recorded, non-root, capability-restricted, resource-bounded, configured at runtime, health-checked, and replaceable without hidden state.",
      "rationale": "Containers improve reproducibility but do not automatically provide a strong security boundary or safe operations.",
      "implementation_evidence": ["Pinned image digest", "Image inventory or SBOM", "Runtime security configuration", "State and restore design"],
      "tests": ["Image vulnerability review", "Non-root and capability check", "Resource-exhaustion test", "Replacement and rollback test"],
      "owner": "platform-owner",
      "exception": { "allowed": true, "conditions": "Document non-container deployment controls that achieve equivalent isolation, reproducibility, and rollback.", "expiry_required": true, "approval_required": "platform-owner" },
      "source_reference": "Section 21.1.1"
    },
    {
      "id": "DATA-01",
      "title": "No unknown copies",
      "requirement_level": "MUST",
      "scope": ["data", "privacy", "server", "release"],
      "requirement": "Every new data field, provider, event, log attribute, export, AI use, region, or retention period must update the inventory and applicable public notice before production.",
      "rationale": "Data cannot be secured, deleted, disclosed, or governed when its copies and purposes are unknown.",
      "implementation_evidence": ["Data inventory", "Retention and deletion map", "Notice change record"],
      "tests": ["Data-flow review", "Deletion propagation test", "Access and recipient review"],
      "owner": "data-owner",
      "exception": { "allowed": false, "conditions": "Unknown production data copies block release.", "expiry_required": false, "approval_required": "privacy-owner" },
      "source_reference": "Chapter 25"
    },
    {
      "id": "FIX-08",
      "title": "Production data isolation",
      "requirement_level": "MUST",
      "scope": ["data", "privacy", "security", "testing"],
      "requirement": "Development and test fixtures must use synthetic or specifically approved data and be technically isolated from production databases, buckets, queues, credentials, analytics, and external side effects.",
      "rationale": "Environment labels do not prevent accidental reads, writes, notifications, charges, or disclosure.",
      "implementation_evidence": ["Environment boundary design", "Synthetic fixture source", "Separate credentials and endpoints"],
      "tests": ["Production-endpoint denial test", "Credential-scope review", "External-side-effect interception test"],
      "owner": "engineering-owner",
      "exception": { "allowed": true, "conditions": "Any approved production-derived test data requires documented necessity, minimization, de-identification, access control, retention, deletion, and privacy approval.", "expiry_required": true, "approval_required": "privacy-and-security-owner" },
      "source_reference": "Appendix B"
    },
    {
      "id": "PRIV-01",
      "title": "Privacy notice matches reality",
      "requirement_level": "MUST",
      "scope": ["privacy", "data", "content", "page"],
      "requirement": "Public privacy information must identify the responsible entity, actual data, sources, purposes, legal grounds, recipients, transfers, retention, rights routes, children or AI use, effective date, and contact details that match current operations.",
      "rationale": "Generic policy text does not disclose actual processing or give people a usable rights path.",
      "implementation_evidence": ["Approved privacy drafting sheet", "Data inventory mapping", "Versioned published notice"],
      "tests": ["Notice-to-system comparison", "Rights-request route test", "Contact monitoring test"],
      "owner": "privacy-owner",
      "exception": { "allowed": false, "conditions": "Materially inaccurate public privacy statements block release.", "expiry_required": false, "approval_required": "privacy-owner" },
      "source_reference": "Chapters 23-27"
    },
    {
      "id": "AGT-01",
      "title": "No autonomous truth",
      "requirement_level": "MUST",
      "scope": ["agent", "content", "security", "privacy", "payment", "release"],
      "requirement": "An AI agent may propose bounded work but must not invent claims or make final legal, security, privacy, payment, migration, destructive, or production-release decisions.",
      "rationale": "Generation ability is not authority, product knowledge, accountability, or evidence of correctness.",
      "implementation_evidence": ["Agent task authorization", "Human approval record", "Diff and evidence review"],
      "tests": ["Stop-condition scenario test", "Unverified-claim review", "Production-authority boundary test"],
      "owner": "human-maintainer",
      "exception": { "allowed": false, "conditions": "Human accountability cannot be delegated to an agent.", "expiry_required": false, "approval_required": "human-maintainer" },
      "source_reference": "Chapter 19"
    },
    {
      "id": "AGENT-DEP",
      "title": "No guessed dependency",
      "requirement_level": "MUST",
      "scope": ["agent", "security", "repository", "release"],
      "requirement": "Every dependency change must verify exact package identity, version, approved source, maintainer continuity, compatibility, license, need, install behavior, manifest diff, lockfile diff, clean frozen-lockfile install, tests, scans, and rollback.",
      "rationale": "A plausible but invented or mistyped dependency can introduce supply-chain compromise or an unreviewed transitive graph.",
      "implementation_evidence": ["Registry and source verification", "Manifest and lockfile diff", "Clean-install result", "Rollback record"],
      "tests": ["Frozen-lockfile install", "Build and test suite", "Security and license scans", "Representative runtime check"],
      "owner": "dependency-change-owner",
      "exception": { "allowed": false, "conditions": "Unverified dependency changes must stop rather than use a plausible substitute.", "expiry_required": false, "approval_required": "security-owner" },
      "source_reference": "Section 30.6"
    },
    {
      "id": "AGENT-30",
      "title": "Verification over obedience",
      "requirement_level": "MUST",
      "scope": ["agent", "testing", "repository"],
      "requirement": "Agent completion must provide an inspectable mapping from requirement to code, test, evidence, exception, owner, unresolved risk, and required human approval.",
      "rationale": "Following instructions is not the same as demonstrating a correct, safe, or releasable result.",
      "implementation_evidence": ["Completion report", "Control applicability matrix", "Reviewed diff"],
      "tests": ["Evidence completeness review", "Independent human verification"],
      "owner": "human-maintainer",
      "exception": { "allowed": false, "conditions": "Claims without inspectable evidence are not accepted.", "expiry_required": false, "approval_required": "human-maintainer" },
      "source_reference": "Chapter 30"
    },
    {
      "id": "REPO-31",
      "title": "Book and repository must agree",
      "requirement_level": "MUST",
      "scope": ["repository", "book", "release"],
      "requirement": "Every repository release must declare the exact book edition it implements and record whether each material change clarifies, strengthens, deprecates, or breaks the earlier contract.",
      "rationale": "The repository cannot be a trustworthy adoption layer if its controls silently drift from the editorial standard.",
      "implementation_evidence": ["VERSION", "Changelog", "Release manifest", "Schema compatibility note"],
      "tests": ["Version consistency validation", "Required-file validation", "Release checksum verification"],
      "owner": "repository-maintainer",
      "exception": { "allowed": false, "conditions": "Edition identity is required for every published release.", "expiry_required": false, "approval_required": "publisher" },
      "source_reference": "Chapter 31"
    }
  ]
}

