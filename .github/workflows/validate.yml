name: Validate companion repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate structure, schemas, links, controls, examples, and safety markers
        run: npm run validate

      - name: Test Fieldbook CLI
        run: node --test packages/cli/test/*.test.mjs

      - name: Verify npm package contents
        working-directory: packages/cli
        run: npm pack --dry-run

      - name: Verify release checksums
        run: npm run checksums:verify

