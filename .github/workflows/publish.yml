name: Publish Fieldbook to npm

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type publish-fieldbook to confirm'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-fieldbook-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'publish-fieldbook'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Show npm version
        run: npm --version

      - name: Test CLI
        run: npm test

      - name: Inspect publish contents
        run: npm pack --dry-run

      - name: Publish fieldbook
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
