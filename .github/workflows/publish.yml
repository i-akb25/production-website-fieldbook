name: Publish Fieldbook to npm

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type publish-fieldbook to confirm'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-fieldbook-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'publish-fieldbook'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify npm supports trusted publishing
        shell: bash
        run: |
          npm --version
          node - <<'NODE'
          const [major, minor, patch] = process.env.npm_config_user_agent
            .match(/npm\/(\d+)\.(\d+)\.(\d+)/)
            .slice(1)
            .map(Number);
          const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
          if (!ok) {
            console.error("Trusted publishing requires npm >= 11.5.1.");
            process.exit(1);
          }
          NODE

      - name: Test CLI
        run: npm test

      - name: Inspect publish contents
        run: npm pack --dry-run

      - name: Refuse an already-published version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "fieldbook@$VERSION" version >/dev/null 2>&1; then
            echo "fieldbook@$VERSION already exists on npm."
            exit 1
          fi

      - name: Publish fieldbook using npm trusted publishing
        run: npm publish --access public
